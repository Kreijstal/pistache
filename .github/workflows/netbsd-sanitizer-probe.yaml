name: NetBSD sanitizer probe
on:
  push:
    branches: [ci/netbsd-sanitizer-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '10.2'
          usesh: true
          run: |
            set -eu
            pkg_add -u curl meson brotli pkgconf rapidjson libevent
            export CC=gcc CXX=g++ LC_ALL=C
            ldd /usr/pkg/lib/libcurl.so
            pkg-config --modversion openssl
            pkg-config --libs openssl
            meson setup build -DPISTACHE_BUILD_TESTS=true -DPISTACHE_DEBUG=false -DPISTACHE_USE_SSL=true -DPISTACHE_USE_CONTENT_ENCODING_DEFLATE=true -DPISTACHE_USE_CONTENT_ENCODING_BROTLI=true -DPISTACHE_USE_CONTENT_ENCODING_ZSTD=true --buildtype=debug -Db_coverage=true -Db_sanitize=address -Db_lundef=false
            ninja -C build tests/run_cookie_test tests/run_headers_test tests/run_http_server_test tests/run_mime_test tests/run_https_server_test tests/run_leak_socket
            paxctl +a build/tests/run_cookie_test
            ldd build/tests/run_https_server_test
            nm -D build/tests/run_cookie_test | grep -E 'clone|fork' || test $? = 1
            export LD_LIBRARY_PATH="$PWD/build/src"
            export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
            find build/tests -type f -name 'run_*' -exec paxctl +a {} +
            meson test -C build --no-rebuild --verbose cookie_test headers_test http_server_test mime_test https_server_test
