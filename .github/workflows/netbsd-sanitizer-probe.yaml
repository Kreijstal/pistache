name: NetBSD sanitizer probe
on:
  push:
    branches: [ci/netbsd-sanitizer-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: |
            set -eu
            uname -a
            cc --version
            cc -print-file-name=libasan.so
            mount
            sysctl kern.securelevel
            cat > sanitizer-smoke.c <<'EOF'
            #include <stdlib.h>
            #include <errno.h>
            #include <string.h>
            int main(int argc, char **argv) {
              if (argc > 1 && strcmp(argv[1], "leak") == 0) {
                char *p = malloc(37);
                *(volatile char *)p = 1;
              }
              if (argc > 1 && strcmp(argv[1], "errno") == 0) errno = EINVAL;
              return 0;
            }
            EOF
            cc -g -O0 -fsanitize=address -fno-omit-frame-pointer sanitizer-smoke.c -o sanitizer-smoke
            cc -g -O0 --coverage -pthread -fsanitize=address -fno-omit-frame-pointer sanitizer-smoke.c -o sanitizer-coverage
            paxctl +a sanitizer-smoke
            paxctl +a sanitizer-coverage
            ldd sanitizer-smoke
            export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
            export LSAN_OPTIONS=verbosity=2:log_threads=1
            echo 'BASELINE CLEAN'
            status=0
            ./sanitizer-smoke > baseline-clean.log 2>&1 || status=$?
            cat baseline-clean.log
            echo "baseline clean status=$status"
            echo 'BASELINE COVERAGE CLEAN'
            status=0
            ./sanitizer-coverage > baseline-coverage.log 2>&1 || status=$?
            cat baseline-coverage.log
            echo "baseline coverage status=$status"
            echo 'BASELINE LEAK'
            status=0
            ./sanitizer-smoke leak > baseline-leak.log 2>&1 || status=$?
            cat baseline-leak.log
            echo "baseline leak status=$status"
            echo 'ERRNO CLEAN'
            status=0
            ./sanitizer-smoke errno > errno-clean.log 2>&1 || status=$?
            cat errno-clean.log
            echo "errno clean status=$status"
            echo 'ERRNO COVERAGE CLEAN'
            status=0
            ./sanitizer-coverage errno > errno-coverage.log 2>&1 || status=$?
            cat errno-coverage.log
            echo "errno coverage status=$status"
            echo 'KERNEL CLONE TRACE'
            status=0
            ktrace -i -t c -f clone.ktrace ./sanitizer-smoke errno > traced.log 2>&1 || status=$?
            cat traced.log
            echo "traced status=$status"
            kdump -f clone.ktrace | grep -E 'clone|EINVAL|Err#22' 
