name: NetBSD sanitizer probe
on:
  push:
    branches: [ci/netbsd-sanitizer-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '10.2'
          usesh: true
          run: |
            set -eu
            pkg_add -u curl meson brotli pkgconf rapidjson libevent clang compiler-rt
            export CC=clang CXX="clang++ -shared-libasan" CXX_LD=ld LC_ALL=C
            export LD_LIBRARY_PATH="$(clang -print-runtime-dir)"
            clang --version
            clang++ --version
            ldd /usr/pkg/lib/libcurl.so
            pkg-config --modversion openssl
            pkg-config --libs openssl
            cat > sanitizer-cxx.cc <<'EOF'
            #include <sstream>
            #include <string>
            #include <openssl/pem.h>
            int main() {
              std::stringstream out;
              out << std::string(1000, 'x');
              if (out.str().size() != 1000) return 1;
              BIO *bio = BIO_new_file("tests/certs/server_protected.key", "r");
              if (!bio) return 2;
              EVP_PKEY *key = PEM_read_bio_PrivateKey(bio, nullptr, nullptr, (void*)"test");
              BIO_free(bio);
              if (!key) return 3;
              EVP_PKEY_free(key);
              return 0;
            }
            EOF
            clang++ -g -O0 -fsanitize=address -shared-libasan sanitizer-cxx.cc -lcrypto -o sanitizer-cxx
            paxctl +a sanitizer-cxx
            ./sanitizer-cxx
            meson setup build -DPISTACHE_BUILD_TESTS=true -DPISTACHE_DEBUG=false -DPISTACHE_USE_SSL=true -DPISTACHE_USE_CONTENT_ENCODING_DEFLATE=true -DPISTACHE_USE_CONTENT_ENCODING_BROTLI=true -DPISTACHE_USE_CONTENT_ENCODING_ZSTD=true --buildtype=debug -Db_coverage=false -Db_sanitize=address -Db_lundef=false
            ninja -C build tests/run_headers_test tests/run_leak_socket
            paxctl +a build/tests/run_headers_test
            ldd build/tests/run_headers_test
            nm -D build/tests/run_headers_test | grep -E 'clone|fork' || test $? = 1
            export LD_LIBRARY_PATH="$PWD/build/src:$LD_LIBRARY_PATH"
            export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
            find build/tests -type f -name 'run_*' -exec paxctl +a {} +
            meson test -C build --no-rebuild --verbose headers_test
